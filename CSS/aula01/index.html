<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cascsding Stylesheet</title>
    <!-- CSS embedded (embutido) -->
    <style>
        p {
            font-size: 100px;
        }
        #gato {
            color: goldenrod;
        }
        #cachorro {
            color: cadetblue;
        }
    </style>
</head>
<body>

    <!-- CSS inline é aqule qu vai dentro da própria tag -->
    <p style="color: rebeccapurple; font-size: 200px;">Gabriel</p>
    <p id="cachorro">Brisa</p>
    <p id="gato">Brisado</p>

</body>
</html>
