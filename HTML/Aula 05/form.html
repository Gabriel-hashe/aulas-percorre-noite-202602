<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <h1>Formulário de cadastro</h1>
    <form action="">
        <!-- Label é um conectivo do input para representa-lo, para que um interaja
        com o outro -->
        <label for="email">Ensira seu email</label>
        <!--nput ser paraimplementar uma caixa de texto juntamente com o id  -->
    <input type="text" id="email">
    
    <br>

    <label for="nome">Ensira seu nome</label>
    <input type="text" id="nome">
    
    <br>

    <label for="botton"></label>
    <input type="button" id="buttom" value="Enviar">
    
    <br>

    </form>
</body>
</html>
