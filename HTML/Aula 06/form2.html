<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário 2 - Radio e Checkbox</title>
</head>

<body>
    <header>

    </header>
    <main>
        <form action="">
            <label for="email">Insira seu email:</label>
            <input type="email" id="email" placeholder="jerimum123@gmail.com" required="true">

            <br>

            <label for="nome">Insira seu nome:</label>
            <input type="text" id="nome" placeholder="juresclaudio transquilho" required="true" maxlength="100">

            <br>

            <label for="color">Escolha sua cor:</label>
            <input type="color" id="color">

            <br>

            <label for="">Avalie o atendimento</label>
            <br>

            <input type="radio" name="estrelas" id="3estrela" value="3">
            <label for="3estrela">⭐⭐⭐</label>
            <br>

            <input type="radio" name="estrelas" id="2estrelas" value="2">
            <label for="2estrelas">⭐⭐</label>
            <br>

            <input type="radio" name="estrelas" id="1estrela" value="1">
            <label for="1estrela">⭐</label>
            <br>

            <label for="comentario">Deixe um comentário</label>
            <br> 

            <textarea name="" id="comentario" placeholder="Seu comentário aqui" cols="" rows=""></textarea>
            <br>

            <input type="submit" value="Enviar!">

        </form>
    </main>
    <footer></footer>
</body>

</html>
